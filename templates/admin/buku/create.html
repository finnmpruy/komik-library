<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{ font-family: 'Poppins', sans-serif; }
        body{ background: #f5f7fb; }
        .sidebar{ width: 260px; height: 100vh; background: #0d6efd; position: fixed; left: 0; top: 0; padding-top: 20px; color: white; }
        .sidebar h2{ text-align: center; font-weight: 700; margin-bottom: 40px; }
        .sidebar a{ display: block; color: white; text-decoration: none; padding: 15px 25px; transition: 0.3s; font-size: 15px; }
        .sidebar a:hover{ background: rgba(255,255,255,0.2); }
        .main-content{ margin-left: 260px; padding: 30px; }
        .topbar{ background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .form-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>📚 Komik Library</h2>
        <a href="/dashboardadmin">Dashboard</a>
        <a href="/admin/buku/" style="background: rgba(255,255,255,0.2);">Kelola Buku</a>
        <a href="/admin/peminjaman/">Data Peminjaman</a>
        <a href="#">Logout</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h4>Tambah Komik Baru ➕</h4>
            <p class="text-muted mb-0">Isi formulir di bawah ini dengan lengkap untuk menambahkan koleksi</p>
        </div>

        <div class="form-container">
            <form action="/admin/buku/store" method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Judul Komik</label>
                        <input type="text" name="judul" class="form-control" placeholder="Masukkan judul komik" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-medium">Penulis / Mangaka</label>
                        <input type="text" name="penulis" class="form-control" placeholder="Nama penulis" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-medium">Penerbit</label>
                        <input type="text" name="penerbit" class="form-control" placeholder="Nama penerbit" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-medium">Tahun Terbit</label>
                        <input type="number" name="tahun_terbit" class="form-control" placeholder="Contoh: 2023" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-medium">Jumlah Stok</label>
                        <input type="number" name="stok" class="form-control" placeholder="Jumlah buku" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-medium">Deskripsi / Sinopsis</label>
                    <textarea name="deskripsi" class="form-control" rows="4" placeholder="Tulis sinopsis cerita komik..."></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium">Upload Cover Komik</label>
                    <input type="file" name="cover" class="form-control" accept="image/*">
                    <div class="form-text">Format file harus berupa gambar (jpg, jpeg, png).</div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/admin/buku/" class="btn btn-light px-4">Kembali</a>
                    <button type="submit" class="btn btn-primary px-4">Simpan Buku</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
